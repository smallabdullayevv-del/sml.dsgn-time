<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smldsgn - Shaxsiy Kun Tartibi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        appBg: '#121214',
                        appCard: '#1C1C1E',
                        appOrange: '#FF5522',
                        appBlue: '#8FA5FF',
                        appMuted: '#8E8E93',
                        goldAccent: '#C8A97E',
                        authBg: '#0b0b0d'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    borderRadius: {
                        '4xl': '32px',
                        '5xl': '40px'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0b0b0d;
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #121214;
        }
        ::-webkit-scrollbar-thumb {
            background: #2C2C2E;
            border-radius: 999px;
        }

        .circular-progress {
            background: conic-gradient(var(--p-color, #FF5522) calc(var(--p-val, 0) * 1%), #2C2C2E 0);
        }

        .pill-dashed-box {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
        }

        .smooth-scale {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
        }

        .smooth-scale:active {
            transform: scale(0.96);
        }

        .bento-auth-card {
            background: #1C1C1E;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .bento-orange-btn {
            background: #FF5522;
            transition: all 0.2s ease;
        }

        .bento-orange-btn:hover {
            background: #e04415;
            box-shadow: 0 10px 25px -5px rgba(255, 85, 34, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-appOrange selection:text-white pb-10">

    <div id="authScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0c0c0e] overflow-y-auto">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-appOrange/10 via-[#0c0c0e] to-black pointer-events-none"></div>

        <div class="w-full max-w-sm bento-auth-card rounded-5xl p-7 relative space-y-6 my-auto text-center">
            
            <div class="flex justify-center pt-2">
                <div class="w-16 h-16 rounded-3xl bg-appOrange flex items-center justify-center shadow-lg shadow-appOrange/20 text-white">
                    <i class="fa-solid fa-user-astronaut text-2xl"></i>
                </div>
            </div>

            <div>
                <h2 class="text-2xl font-black tracking-tight text-white">Salom! <span class="inline-block animate-bounce">👋</span></h2>
                <p class="text-xs text-appMuted mt-1">Kun tartibingizni yo'lga qo'yish uchun profilingizni kiriting</p>
            </div>

            <form id="authForm" class="space-y-4 text-left">
                <div>
                    <label class="block text-[11px] font-bold text-white/70 uppercase tracking-wider mb-2">Ismingiz</label>
                    <div class="relative flex items-center">
                        <i class="fa-regular fa-user absolute left-4 text-xs text-appMuted"></i>
                        <input type="text" id="authName" required placeholder="Sardor" 
                            class="w-full bg-[#121214] border border-white/10 rounded-2xl pl-10 pr-4 py-3.5 text-xs text-white focus:outline-none focus:border-appOrange transition placeholder:text-appMuted/40 font-medium">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-white/70 uppercase tracking-wider mb-2">Profil rasmi</label>
                    <div class="flex items-center gap-2 w-full">
                        <label class="flex items-center justify-between min-w-0 flex-1 bg-[#121214] border border-white/10 border-dashed rounded-2xl px-3 py-3 text-xs text-appMuted hover:text-white hover:border-appOrange/50 cursor-pointer transition">
                            <div class="flex items-center gap-2 min-w-0 pr-1">
                                <i class="fa-solid fa-image text-appOrange text-xs shrink-0"></i>
                                <span id="authFileLabel" class="truncate font-medium text-white/80 text-[11px]">Galereyadan tanlash</span>
                            </div>
                            <span class="text-[10px] bg-white/10 text-white px-2 py-1 rounded-lg font-semibold shrink-0 ml-1">Tanlash</span>
                            <input type="file" id="authAvatarFile" accept="image/*" class="hidden">
                        </label>
                        <button type="button" id="removeAvatarBtn" title="Rasmni o'chirish" class="hidden h-[42px] w-[42px] bg-[#121214] border border-white/10 rounded-2xl text-red-400 hover:bg-red-500/10 hover:border-red-500/30 flex items-center justify-center shrink-0 transition">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="w-full py-4 rounded-3xl bento-orange-btn text-white font-bold text-xs flex items-center justify-center gap-2 smooth-scale mt-3">
                    <span>Kirish va boshlash</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>
        </div>
    </div>

    <div id="mainDashboard" class="max-w-md w-full mx-auto px-4 pt-6 space-y-5 hidden">
        
        <header class="flex items-center justify-between pt-2 px-1">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full overflow-hidden border border-white/10 bg-black flex items-center justify-center relative shadow-lg">
                    <img id="userAvatarImg" src="https://iili.io/nXRMlGn.jpg" alt="smldsgn" class="w-full h-full object-cover">
                </div>
                <div>
                    <span class="text-xs text-appMuted flex items-center gap-1 font-medium">
                        Salom <span class="text-amber-300">👋</span>
                    </span>
                    <h1 id="userGreeting" class="text-xl font-bold tracking-tight text-white">smldsgn</h1>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button id="openAddTaskBtn" class="w-11 h-11 rounded-full bg-appCard border border-white/5 flex items-center justify-center text-white text-sm smooth-scale shadow-md" title="Yangi reja">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button id="logoutBtn" class="w-11 h-11 rounded-full bg-appCard border border-white/5 flex items-center justify-center text-neutral-400 hover:text-white text-xs smooth-scale relative" title="Chiqish">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-2 gap-3.5">
            
            <div class="bg-appOrange text-white rounded-4xl p-5 flex flex-col justify-between h-60 relative overflow-hidden shadow-xl shadow-appOrange/10">
                <div class="flex items-start justify-between">
                    <div>
                        <h2 class="text-lg font-bold leading-tight">Bugungi<br>reja</h2>
                    </div>
                    <div class="w-9 h-9 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center text-white text-xs">
                        <i class="fa-solid fa-dumbbell"></i>
                    </div>
                </div>

                <div class="space-y-2 mt-auto" id="bentoMiniTasks">
                </div>
            </div>

            <div class="bg-appBlue text-black rounded-4xl p-5 flex flex-col justify-between h-60 shadow-xl shadow-appBlue/10">
                <div>
                    <span id="liveDate" class="text-xs font-semibold text-black/60 block mb-1">15-may</span>
                    <h2 class="text-lg font-bold leading-snug tracking-tight text-black">Diqqatni jamlash taymeri</h2>
                </div>

                <div class="bg-white rounded-3xl p-2 flex items-center justify-between shadow-lg gap-2">
                    <div class="pl-3">
                        <span id="pomoDisplay" class="text-base font-extrabold font-mono tracking-tight text-black">25:00</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button id="resetPomo" title="Qayta o'rnatish" class="w-9 h-9 rounded-full bg-black/10 text-black hover:bg-black/20 flex items-center justify-center text-xs smooth-scale">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>
                        <button id="togglePomo" class="w-9 h-9 rounded-full bg-black text-white flex items-center justify-center text-xs smooth-scale">
                            <i id="pomoIcon" class="fa-solid fa-play ml-0.5"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <div class="bg-white text-black rounded-4xl p-5 shadow-xl flex items-center justify-between gap-3">
            <div class="flex items-center gap-3.5 min-w-0 flex-1">
                <div id="categoryIconBg" class="w-12 h-12 rounded-2xl bg-appOrange text-white flex items-center justify-center text-lg font-bold shadow-md shrink-0">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div class="flex flex-col min-w-0 pr-2">
                    <h3 id="currentMainTitle" class="text-base font-extrabold tracking-tight text-black leading-tight">Kunlik maqsadlar</h3>
                    <p id="currentMainSub" class="text-xs text-black/60 font-semibold mt-1">0 ta bajarildi</p>
                </div>
            </div>

            <div class="relative w-14 h-14 rounded-full flex items-center justify-center circular-progress p-1 shrink-0" id="progressRing" style="--p-val: 0; --p-color: #FF5522;">
                <div class="w-full h-full bg-white rounded-full flex items-center justify-center">
                    <span id="completionPercentText" class="text-xs font-extrabold text-black">0%</span>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2 overflow-x-auto py-1 no-scrollbar" id="filterContainer">
            <button data-filter="all" class="filter-btn bg-white text-black px-4 py-2.5 rounded-full text-xs font-bold whitespace-nowrap smooth-scale shadow-sm">Barchasi</button>
            <button data-filter="health" class="filter-btn bg-appCard text-appMuted px-4 py-2.5 rounded-full text-xs font-semibold whitespace-nowrap smooth-scale">Sport</button>
            <button data-filter="study" class="filter-btn bg-appCard text-appMuted px-4 py-2.5 rounded-full text-xs font-semibold whitespace-nowrap smooth-scale">Ta'lim</button>
            <button data-filter="work" class="filter-btn bg-appCard text-appMuted px-4 py-2.5 rounded-full text-xs font-semibold whitespace-nowrap smooth-scale">Ish</button>
            <button data-filter="personal" class="filter-btn bg-appCard text-appMuted px-4 py-2.5 rounded-full text-xs font-semibold whitespace-nowrap smooth-scale">Hordiq</button>
        </div>

        <div class="bg-appCard rounded-3xl p-4 border border-white/5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-sky-500/10 text-sky-400 flex items-center justify-center text-sm">
                    <i class="fa-solid fa-droplet"></i>
                </div>
                <div>
                    <h4 class="text-xs font-bold text-white">Suv me'yori</h4>
                    <p id="waterCountText" class="text-[11px] text-appMuted mt-0.5">0/5 stakan ichildi</p>
                </div>
            </div>
            <div class="flex gap-1.5" id="waterTrackerContainer">
                <button onclick="toggleWater(1)" class="water-glass w-8 h-8 rounded-xl bg-appBg text-sky-400 text-xs flex items-center justify-center smooth-scale border border-white/5"><i class="fa-solid fa-glass-water"></i></button>
                <button onclick="toggleWater(2)" class="water-glass w-8 h-8 rounded-xl bg-appBg text-sky-400 text-xs flex items-center justify-center smooth-scale border border-white/5"><i class="fa-solid fa-glass-water"></i></button>
                <button onclick="toggleWater(3)" class="water-glass w-8 h-8 rounded-xl bg-appBg text-sky-400 text-xs flex items-center justify-center smooth-scale border border-white/5"><i class="fa-solid fa-glass-water"></i></button>
                <button onclick="toggleWater(4)" class="water-glass w-8 h-8 rounded-xl bg-appBg text-sky-400 text-xs flex items-center justify-center smooth-scale border border-white/5"><i class="fa-solid fa-glass-water"></i></button>
                <button onclick="toggleWater(5)" class="water-glass w-8 h-8 rounded-xl bg-appBg text-sky-400 text-xs flex items-center justify-center smooth-scale border border-white/5"><i class="fa-solid fa-glass-water"></i></button>
            </div>
        </div>

        <div class="space-y-3 pt-1">
            <div class="flex items-center justify-between px-1">
                <h3 class="text-sm font-bold text-white">Kunlik jadval</h3>
                <span id="liveClock" class="text-xs font-mono font-semibold text-appOrange">00:00</span>
            </div>

            <div id="scheduleTimeline" class="space-y-2.5">
            </div>
        </div>

        <div class="text-center pt-4 pb-2">
            <button id="clearAllBtn" class="text-xs text-appMuted hover:text-red-400 transition">
                Barcha rejalarni tozalash
            </button>
        </div>

    </div>

    <div id="taskModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-appCard border border-white/10 w-full max-w-md rounded-t-4xl sm:rounded-4xl p-6 relative shadow-2xl">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-base font-bold text-white">Yangi reja qo'shish</h3>
                <button id="closeModalBtn" class="w-8 h-8 rounded-full bg-white/5 text-appMuted flex items-center justify-center text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="taskForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-appMuted mb-1.5">Vazifa nomi</label>
                    <input type="text" id="taskTitle" required placeholder="Masalan: Yugurish mashg'uloti" 
                        class="w-full bg-appBg border border-white/10 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-appOrange transition placeholder:text-appMuted/50">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-appMuted mb-1.5">Boshlanish vaqti</label>
                        <input type="time" id="taskTime" required value="08:00"
                            class="w-full bg-appBg border border-white/10 rounded-2xl px-3 py-3 text-xs text-white font-mono focus:outline-none focus:border-appOrange text-center">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-appMuted mb-1.5">Kategoriya</label>
                        <select id="taskCategory" class="w-full bg-appBg border border-white/10 rounded-2xl px-3 py-3 text-xs text-white focus:outline-none focus:border-appOrange">
                            <option value="health">Sport</option>
                            <option value="study">Ta'lim</option>
                            <option value="work">Ish</option>
                            <option value="personal">Hordiq</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-appMuted mb-1.5">Qisqa izoh</label>
                    <textarea id="taskDesc" rows="2" placeholder="Tafsilotlar..." 
                        class="w-full bg-appBg border border-white/10 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-appOrange resize-none placeholder:text-appMuted/50"></textarea>
                </div>

                <div class="pt-2 flex items-center gap-3">
                    <button type="button" id="cancelModalBtn" class="flex-1 py-3 rounded-2xl bg-white/5 text-xs font-semibold text-appMuted">Bekor qilish</button>
                    <button type="submit" class="flex-1 py-3 rounded-2xl bg-appOrange text-white font-bold text-xs smooth-scale shadow-lg shadow-appOrange/20">Saqlash</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const defaultTasks = [
            { id: '1', title: 'Ertalabki yugurish', time: '06:30', category: 'health', desc: 'Toza havoda 20 daqiqa yengil chigal yozdi mashqlari', completed: true },
            { id: '2', title: 'Kitob mutolaasi', time: '08:00', category: 'study', desc: 'Kunlik 30 sahifa foydali mutolaa', completed: true },
            { id: '3', title: 'Muhamadali bilan uchrashuv', time: '12:00', category: 'work', desc: 'Yangi loyiha muhokamasi', completed: false },
            { id: '4', title: 'Kechki mashg\'ulot', time: '18:00', category: 'health', desc: 'Zalda oyoq va kardio mashqlari', completed: false }
        ];

        let tasks = JSON.parse(localStorage.getItem('smldsgn_routine_tasks')) || defaultTasks;
        let activeFilter = 'all';
        let waterGlassCount = JSON.parse(localStorage.getItem('smldsgn_water')) || 0;
        let currentUser = JSON.parse(localStorage.getItem('smldsgn_user')) || null;
        let tempAvatarBase64 = 'https://iili.io/nXRMlGn.jpg';

        const authScreen = document.getElementById('authScreen');
        const mainDashboard = document.getElementById('mainDashboard');
        const authForm = document.getElementById('authForm');
        const authAvatarFile = document.getElementById('authAvatarFile');
        const authFileLabel = document.getElementById('authFileLabel');
        const removeAvatarBtn = document.getElementById('removeAvatarBtn');
        const userGreeting = document.getElementById('userGreeting');
        const userAvatarImg = document.getElementById('userAvatarImg');
        const logoutBtn = document.getElementById('logoutBtn');

        const scheduleTimeline = document.getElementById('scheduleTimeline');
        const bentoMiniTasks = document.getElementById('bentoMiniTasks');
        const taskModal = document.getElementById('taskModal');
        const openAddTaskBtn = document.getElementById('openAddTaskBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const taskForm = document.getElementById('taskForm');
        const clearAllBtn = document.getElementById('clearAllBtn');

        authAvatarFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                authFileLabel.innerText = file.name;
                removeAvatarBtn.classList.remove('hidden');
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    tempAvatarBase64 = uploadEvent.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        removeAvatarBtn.addEventListener('click', () => {
            tempAvatarBase64 = 'https://iili.io/nXRMlGn.jpg';
            authFileLabel.innerText = 'Galereyadan tanlash';
            authAvatarFile.value = '';
            removeAvatarBtn.classList.add('hidden');
        });

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('authName').value.trim() || 'Foydalanuvchi';

            currentUser = { 
                name: name, 
                avatar: tempAvatarBase64 
            };
            localStorage.setItem('smldsgn_user', JSON.stringify(currentUser));
            initializeUserSession();
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('smldsgn_user');
            currentUser = null;
            authScreen.classList.remove('hidden');
            mainDashboard.classList.add('hidden');
        });

        function initializeUserSession() {
            if (currentUser) {
                userGreeting.innerText = currentUser.name;
                if (currentUser.avatar) {
                    userAvatarImg.src = currentUser.avatar;
                }
                authScreen.classList.add('hidden');
                mainDashboard.classList.remove('hidden');
            } else {
                authScreen.classList.remove('hidden');
                mainDashboard.classList.add('hidden');
            }
        }

        function renderBentoWidget() {
            bentoMiniTasks.innerHTML = '';
            const topTwo = tasks.slice(0, 2);

            topTwo.forEach(task => {
                const pill = document.createElement('div');
                pill.className = `pill-dashed-box px-3 py-2 rounded-2xl border ${
                    task.completed ? 'border-white/40 text-white/90' : 'border-white/20 text-white'
                } flex items-center gap-2 text-xs`;

                pill.innerHTML = `
                    <div class="w-4 h-4 rounded-full border border-white/80 flex items-center justify-center text-[9px] shrink-0">
                        ${task.completed ? '<i class="fa-solid fa-check"></i>' : ''}
                    </div>
                    <div class="truncate">
                        <p class="font-semibold truncate text-[11px] leading-none">${escapeHtml(task.title)}</p>
                        <p class="text-[9px] opacity-75 mt-0.5">${task.time}</p>
                    </div>
                `;
                bentoMiniTasks.appendChild(pill);
            });
        }

        function renderTasks() {
            scheduleTimeline.innerHTML = '';
            let filteredTasks = tasks.filter(t => activeFilter === 'all' || t.category === activeFilter);
            filteredTasks.sort((a, b) => a.time.localeCompare(b.time));

            if (filteredTasks.length === 0) {
                scheduleTimeline.innerHTML = `
                    <div class="text-center py-8 border border-white/5 rounded-3xl bg-appCard/50">
                        <p class="text-xs text-appMuted">Rejalar mavjud emas</p>
                    </div>
                `;
            } else {
                filteredTasks.forEach(task => {
                    const taskEl = document.createElement('div');
                    taskEl.className = `p-4 rounded-3xl bg-appCard border border-white/5 flex items-center justify-between transition ${
                        task.completed ? 'opacity-50' : ''
                    }`;

                    taskEl.innerHTML = `
                        <div class="flex items-center gap-3 min-w-0 pr-2">
                            <button onclick="toggleTask('${task.id}')" class="w-6 h-6 rounded-full border border-white/20 flex items-center justify-center transition shrink-0 ${
                                task.completed ? 'bg-appOrange border-appOrange text-white' : 'text-transparent'
                            }">
                                <i class="fa-solid fa-check text-[10px]"></i>
                            </button>
                            <div class="min-w-0">
                                <h4 class="text-xs font-bold ${task.completed ? 'line-through text-appMuted' : 'text-white'} truncate">${escapeHtml(task.title)}</h4>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-[10px] font-mono text-appMuted shrink-0">${task.time}</span>
                                    ${task.desc ? `<span class="text-[10px] text-appMuted/80 truncate">${escapeHtml(task.desc)}</span>` : ''}
                                </div>
                            </div>
                        </div>

                        <button onclick="deleteTask('${task.id}')" class="w-8 h-8 rounded-full hover:bg-white/5 text-appMuted hover:text-red-400 flex items-center justify-center transition shrink-0">
                            <i class="fa-regular fa-trash-can text-xs"></i>
                        </button>
                    `;

                    scheduleTimeline.appendChild(taskEl);
                });
            }

            renderBentoWidget();
            updateStats();
            saveToStorage();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.toggleWater = function(count) {
            waterGlassCount = count === waterGlassCount ? count - 1 : count;
            localStorage.setItem('smldsgn_water', JSON.stringify(waterGlassCount));
            renderWaterUI();
        }

        function renderWaterUI() {
            const glasses = document.querySelectorAll('.water-glass');
            glasses.forEach((btn, idx) => {
                if (idx < waterGlassCount) {
                    btn.classList.add('bg-sky-500', 'text-white');
                    btn.classList.remove('bg-appBg', 'text-sky-400');
                } else {
                    btn.classList.remove('bg-sky-500', 'text-white');
                    btn.classList.add('bg-appBg', 'text-sky-400');
                }
            });
            document.getElementById('waterCountText').innerText = `${waterGlassCount}/5 stakan ichildi`;
        }

        window.toggleTask = function(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            renderTasks();
        };

        window.deleteTask = function(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
        };

        function updateStats() {
            const total = tasks.length;
            const done = tasks.filter(t => t.completed).length;
            const percentage = total > 0 ? Math.round((done / total) * 100) : 0;

            document.getElementById('currentMainSub').innerText = `${done} ta bajarildi`;
            document.getElementById('completionPercentText').innerText = `${percentage}%`;
            
            const ring = document.getElementById('progressRing');
            ring.style.setProperty('--p-val', percentage);
        }

        function saveToStorage() {
            localStorage.setItem('smldsgn_routine_tasks', JSON.stringify(tasks));
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('liveClock').innerText = `${hours}:${minutes}`;

            const options = { month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('liveDate').innerText = now.toLocaleDateString('uz-UZ', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        let pomoTime = 25 * 60;
        let pomoInterval = null;
        const pomoDisplay = document.getElementById('pomoDisplay');
        const togglePomoBtn = document.getElementById('togglePomo');
        const resetPomoBtn = document.getElementById('resetPomo');
        const pomoIcon = document.getElementById('pomoIcon');

        function updatePomoDisplay() {
            const m = String(Math.floor(pomoTime / 60)).padStart(2, '0');
            const s = String(pomoTime % 60).padStart(2, '0');
            pomoDisplay.innerText = `${m}:${s}`;
        }

        togglePomoBtn.addEventListener('click', () => {
            if (pomoInterval) {
                clearInterval(pomoInterval);
                pomoInterval = null;
                pomoIcon.className = "fa-solid fa-play ml-0.5";
            } else {
                pomoIcon.className = "fa-solid fa-pause";
                pomoInterval = setInterval(() => {
                    if (pomoTime > 0) {
                        pomoTime--;
                        updatePomoDisplay();
                    } else {
                        clearInterval(pomoInterval);
                        pomoInterval = null;
                        pomoIcon.className = "fa-solid fa-rotate-right";
                    }
                }, 1000);
            }
        });

        resetPomoBtn.addEventListener('click', () => {
            if (pomoInterval) {
                clearInterval(pomoInterval);
                pomoInterval = null;
            }
            pomoTime = 25 * 60;
            pomoIcon.className = "fa-solid fa-play ml-0.5";
            updatePomoDisplay();
        });

        document.getElementById('filterContainer').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('bg-white', 'text-black', 'font-bold');
                    btn.classList.add('bg-appCard', 'text-appMuted', 'font-semibold');
                });

                e.target.classList.remove('bg-appCard', 'text-appMuted');
                e.target.classList.add('bg-white', 'text-black', 'font-bold');

                activeFilter = e.target.getAttribute('data-filter');
                renderTasks();
            }
        });

        openAddTaskBtn.addEventListener('click', () => taskModal.classList.remove('hidden'));
        closeModalBtn.addEventListener('click', () => taskModal.classList.add('hidden'));
        cancelModalBtn.addEventListener('click', () => taskModal.classList.add('hidden'));

        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newTask = {
                id: Date.now().toString(),
                title: document.getElementById('taskTitle').value,
                time: document.getElementById('taskTime').value,
                category: document.getElementById('taskCategory').value,
                desc: document.getElementById('taskDesc').value,
                completed: false
            };

            tasks.push(newTask);
            renderTasks();
            taskForm.reset();
            taskModal.classList.add('hidden');
        });

        clearAllBtn.addEventListener('click', () => {
            tasks = [];
            renderTasks();
        });

        initializeUserSession();
        renderTasks();
        renderWaterUI();
    </script>
</body>
</html>
